# ZugKarte auf dem UGREEN-NAS (UGOS Pro → Docker → Projekt)
#
# Vor dem Start den Tailscale-Key unten ersetzen:
#   TS_AUTHKEY   = Auth-Key aus der Tailscale-Admin-Konsole (für die öffentliche Adresse)
#
# API-Schlüssel von opentransportdata.swiss (SIRI-ET), eine der beiden Varianten:
#   a) einfacher: nach dem ersten Start die Datei  data/schluessel.txt  im Projektordner
#      mit der Dateien-App öffnen und den Schlüssel hineinschreiben (kein Neustart nötig)
#   b) unten bei OTD_API_KEY eintragen (dann muss das Projekt neu bereitgestellt werden)
#
# Danach ist die Karte erreichbar:
#   im Heimnetz:  http://<IP-des-NAS>:8080
#   öffentlich:   https://zugkarte.<dein-tailnet>.ts.net   (über Tailscale Funnel)
#
# Updates: Der Container «zugkarte» holt neue Versionen selbst von GitHub (alle 5 Minuten).
# Nichts manuell hochladen nötig.

services:
  zugkarte:
    image: node:22-alpine
    container_name: zugkarte
    restart: unless-stopped
    working_dir: /data
    command:
      - sh
      - -c
      - >-
        wget -qO /data/launcher.neu https://raw.githubusercontent.com/Arjuna155/zugkarte/main/deploy/launcher.js
        && mv /data/launcher.neu /data/launcher.js;
        exec node /data/launcher.js
    environment:
      - OTD_API_KEY=HIER_DEINEN_OPENTRANSPORTDATA_SCHLUESSEL_EINTRAGEN
      - REPO=Arjuna155/zugkarte
      - BRANCH=main
      - CHECK_MINUTES=5
      - PORT=8080
      - TZ=Europe/Zurich
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  tailscale:
    image: tailscale/tailscale:stable
    container_name: zugkarte-tailscale
    hostname: zugkarte
    restart: unless-stopped
    depends_on:
      - zugkarte
    environment:
      - TS_AUTHKEY=HIER_DEINEN_TAILSCALE_AUTHKEY_EINTRAGEN
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./tailscale:/var/lib/tailscale
    configs:
      - source: tailscale-serve
        target: /config/serve.json

configs:
  tailscale-serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": { "$${TS_CERT_DOMAIN}:443": { "Handlers": { "/": { "Proxy": "http://zugkarte:8080" } } } },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": true }
      }
